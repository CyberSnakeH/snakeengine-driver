name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run hook (e.g. after fixing a workflow bug without
  # cutting a new tag) — must still target an existing annotated tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.1.0)'
        required: true

permissions:
  contents: write   # gh release create / upload
  id-token: write   # cosign keyless OIDC

env:
  COSIGN_YES: 'true'

jobs:
  metadata:
    name: Resolve version metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag:     ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compute version + tag
        id: v
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # The updater trusts a signing identity under refs/tags/, including
          # on manual reruns. Checking out a tag alone does not set that identity.
          test "$GITHUB_REF" = "refs/tags/$tag" || {
              echo 'Run this workflow on the release tag (--ref vX.Y.Z), not a branch.' >&2
              exit 1
          }
          version="$(bash scripts/version.sh --check-tag "$tag")"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

  validate:
    name: Validate release sources
    needs: metadata
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}

  release:
    name: Build, sign, and publish source release
    runs-on: ubuntu-22.04
    needs: [metadata, validate]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/sigstore-verify/go.mod
          cache-dependency-path: tools/sigstore-verify/go.sum

      - name: Install userland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - name: Build userland and verifier
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          make -C userland -j"$(nproc)"
          make -C tools/sigstore-verify VERSION="$VERSION"
          ./tools/sigstore-verify/sigstore-verify version

      - name: Create source release artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=tar.gz \
              --prefix="snakeengine-driver-$VERSION/" \
              -o "release/snakeengine-driver-$VERSION.tar.gz" HEAD
          (cd release && sha256sum "snakeengine-driver-$VERSION.tar.gz" \
              > "snakeengine-driver-$VERSION.tar.gz.sha256")
          install -m 0755 tools/sigstore-verify/sigstore-verify \
              "release/sigstore-verify-$VERSION-linux-amd64"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Cosign keyless sign every artifact
        working-directory: release
        run: |
          set -eux
          for f in snakeengine-driver-*.tar.gz sigstore-verify-*-linux-amd64; do
              [ -f "$f" ] || continue
              # Don't sign signature/checksum files themselves.
              case "$f" in *.sigstore|*.sha256) continue ;; esac
              cosign sign-blob \
                  --new-bundle-format \
                  --bundle "${f}.sigstore" \
                  "$f"
          done
          ls -lh

      - name: Verify signed tarball with the shipped updater verifier
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          chmod 0755 "release/sigstore-verify-${VERSION}-linux-amd64"
          "release/sigstore-verify-${VERSION}-linux-amd64" verify-blob \
              --bundle "release/snakeengine-driver-${VERSION}.tar.gz.sigstore" \
              --certificate-identity-regexp \
                  '^https://github\.com/CyberSnakeH/snakeengine-driver/\.github/workflows/release\.yml@refs/tags/v.*$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "release/snakeengine-driver-${VERSION}.tar.gz"

      - name: Generate aggregate SHA256SUMS
        working-directory: release
        run: |
          find . -maxdepth 1 -type f \
              ! -name '*.sigstore' ! -name '*.sha256' ! -name SHA256SUMS \
              -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:     ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -eu
          notes=$(mktemp)
          {
              git tag -l --format='%(contents)' "$TAG" || true
              cat <<'EOF'

          ## Verifying release artifacts

          The source tarball and verifier are signed with **cosign keyless**
          (Sigstore / Fulcio CA, GitHub OIDC). Each artifact has a companion
          `<file>.sigstore` bundle. To verify:

          ```bash
          cosign verify-blob \
              --bundle <file>.sigstore \
              --certificate-identity-regexp \
                  '^https://github.com/CyberSnakeH/snakeengine-driver/.github/workflows/release.yml@refs/tags/v.*$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              <file>
          ```

          See `SHA256SUMS` for checksums.
          EOF
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release/* --clobber
          else
              gh release create "$TAG" \
                  --title "snakeengine-driver $VERSION" \
                  --notes-file "$notes" \
                  --verify-tag \
                  release/*
          fi
